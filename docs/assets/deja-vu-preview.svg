<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Deja Vu: three-file project memory for AI coding agents</title>
  <desc id="desc">A coding task triggers a tiny cue scan, loads two matching memory records, and gives a new agent the right constraints before planning.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111936"/>
      <stop offset="1" stop-color="#080C18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70F0C0"/>
      <stop offset="1" stop-color="#7AA7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1180" cy="80" r="180" fill="#4678FF" opacity="0.08"/>
  <circle cx="90" cy="620" r="220" fill="#4DE6B1" opacity="0.06"/>

  <g transform="translate(68 66)">
    <rect width="204" height="34" rx="17" fill="#172442" stroke="#2E426D"/>
    <circle cx="20" cy="17" r="5" fill="#70F0C0"/>
    <text x="35" y="22" fill="#B9C9E9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">DEJA VU · MEMORY</text>

    <text x="0" y="100" fill="#F4F7FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="50" font-weight="750">Your repo</text>
    <text x="0" y="158" fill="url(#accent)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="50" font-weight="750">remembers the why.</text>
    <text x="0" y="210" fill="#AAB9D8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21">Three files give every new coding-agent session</text>
    <text x="0" y="241" fill="#AAB9D8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21">the smallest useful slice of project memory.</text>

    <g transform="translate(0 292)">
      <rect width="310" height="58" rx="12" fill="#121D36" stroke="#2B3A5F"/>
      <text x="18" y="24" fill="#70F0C0" font-family="Consolas, SFMono-Regular, monospace" font-size="14">01  AGENTS.md</text>
      <text x="18" y="44" fill="#8799BE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">recall + writeback rules</text>

      <rect y="70" width="310" height="58" rx="12" fill="#121D36" stroke="#2B3A5F"/>
      <text x="18" y="94" fill="#86B4FF" font-family="Consolas, SFMono-Regular, monospace" font-size="14">02  memory/summary.md</text>
      <text x="18" y="114" fill="#8799BE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">durable project truth</text>

      <rect y="140" width="310" height="58" rx="12" fill="#121D36" stroke="#2B3A5F"/>
      <text x="18" y="164" fill="#B89CFF" font-family="Consolas, SFMono-Regular, monospace" font-size="14">03  memory/impressions.jsonl</text>
      <text x="18" y="184" fill="#8799BE" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">tiny recall cues</text>
    </g>
  </g>

  <g transform="translate(632 72)" filter="url(#shadow)">
    <rect width="580" height="486" rx="22" fill="#0B1122" stroke="#30466F" stroke-width="1.5"/>
    <path d="M0 52H580" stroke="#253653"/>
    <circle cx="24" cy="26" r="6" fill="#FF718C"/>
    <circle cx="45" cy="26" r="6" fill="#FFD166"/>
    <circle cx="66" cy="26" r="6" fill="#70F0C0"/>
    <text x="290" y="31" text-anchor="middle" fill="#6F82A8" font-family="Consolas, SFMono-Regular, monospace" font-size="13">new agent session</text>

    <text x="28" y="91" fill="#EAF0FF" font-family="Consolas, SFMono-Regular, monospace" font-size="16">&gt; Continue the settings refactor.</text>
    <text x="28" y="133" fill="#6F82A8" font-family="Consolas, SFMono-Regular, monospace" font-size="14">scan</text>
    <text x="88" y="133" fill="#C8D5EF" font-family="Consolas, SFMono-Regular, monospace" font-size="14">memory/impressions.jsonl</text>

    <rect x="27" y="155" width="526" height="58" rx="10" fill="#101C31" stroke="#243A5D"/>
    <text x="44" y="180" fill="#70F0C0" font-family="Consolas, SFMono-Regular, monospace" font-size="14">strong match</text>
    <text x="44" y="200" fill="#8497BB" font-family="Consolas, SFMono-Regular, monospace" font-size="13">settings · sync · migration</text>
    <text x="524" y="190" text-anchor="end" fill="#70F0C0" font-family="Consolas, SFMono-Regular, monospace" font-size="13">2 records</text>

    <text x="28" y="252" fill="#6F82A8" font-family="Consolas, SFMono-Regular, monospace" font-size="14">load</text>
    <text x="88" y="252" fill="#86B4FF" font-family="Consolas, SFMono-Regular, monospace" font-size="14">decisions/settings-sync.md</text>
    <text x="28" y="282" fill="#6F82A8" font-family="Consolas, SFMono-Regular, monospace" font-size="14">load</text>
    <text x="88" y="282" fill="#B89CFF" font-family="Consolas, SFMono-Regular, monospace" font-size="14">open-loops/settings-migration.md</text>

    <path d="M28 315H552" stroke="#253653"/>
    <text x="28" y="350" fill="#70F0C0" font-family="Consolas, SFMono-Regular, monospace" font-size="15">✓ knows before planning</text>
    <text x="46" y="383" fill="#B7C5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Keep settings server-backed</text>
    <text x="46" y="412" fill="#B7C5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Preserve the IME workaround</text>
    <text x="46" y="441" fill="#B7C5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Continue the legacy-name migration</text>
  </g>

  <text x="1212" y="610" text-anchor="end" fill="#5F7196" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">No database · No embeddings · No SaaS</text>
</svg>
